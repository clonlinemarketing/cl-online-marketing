name: Apply GTM body and footer

on:
  push:
    branches:
      - new-site-upload

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: new-site-upload
          fetch-depth: 0

      - name: Patch all HTML files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          snippet = '<!-- Google Tag Manager (noscript) --><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TP7ZMKHV" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript><!-- End Google Tag Manager (noscript) -->'
          old_footer = '© 2026 CL Online Marketing Agency'
          new_footer = '© 2026 CL Online Marketing Agency | Reg: 201903010031 (002924457-K)'

          changed = 0
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text
              if snippet not in updated and '<body>' in updated:
                  updated = updated.replace('<body>', '<body>' + snippet, 1)
              updated = updated.replace(old_footer, new_footer)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1

          workflow = Path('.github/workflows/apply-gtm-body.yml')
          if workflow.exists():
              workflow.unlink()
          print(f'Patched {changed} HTML files')
          PY

      - name: Commit patched website
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "clonlinemarketingagency@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add GTM body snippet and footer registration [gtm-body]"
          git push origin HEAD:new-site-upload
