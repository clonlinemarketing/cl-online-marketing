name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Push build output to deploy branch
        run: |
          cd dist
          git init
          git config user.name "GitHub Actions"
          git config user.email "clonlinemarketingagency@gmail.com"
          git add -A
          git commit -m "Deploy build from $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/clonlinemarketing/cl-online-marketing.git" HEAD:deploy
